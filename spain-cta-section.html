<!-- Spain CTA -->

<style>
.spain-final-cta-section {
    padding: 120px 0;
    position: relative;
    text-align: center;
    overflow: hidden;
}

.spain-cta-background {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
}

.spain-cta-background::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('https://monumental.global/wp-content/uploads/2025/11/Pool-at-sunset-scaled.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

.spain-cta-background::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
}

.spain-cta-pattern {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0.05;
    background-image: repeating-linear-gradient(45deg, transparent, transparent 35px, rgba(218,165,32,.1) 35px, rgba(218,165,32,.1) 70px),
        repeating-linear-gradient(-45deg, transparent, transparent 35px, rgba(218,165,32,.05) 35px, rgba(218,165,32,.05) 70px);
    animation: patternMove 20s linear infinite;
    z-index: 1;
}

@keyframes patternMove {
    0% { transform: translate(0, 0); }
    100% { transform: translate(70px, 70px); }
}

.spain-cta-content {
    position: relative;
    z-index: 2;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
}

.spain-cta-badge {
    display: inline-block;
    padding: 15px 35px;
    background: #daa520;
    color: white;
    border: 3px solid #daa520;
    border-radius: 50px;
    font-size: 1rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 40px;
    font-weight: 700;
    animation: fadeInDown 1s ease, glow 2s ease-in-out infinite;
    box-shadow: 0 0 30px rgba(218, 165, 32, 0.6), 0 0 60px rgba(218, 165, 32, 0.4);
}

@keyframes glow {
    0%, 100% {
        box-shadow: 0 0 30px rgba(218, 165, 32, 0.6), 0 0 60px rgba(218, 165, 32, 0.4);
    }
    50% {
        box-shadow: 0 0 40px rgba(218, 165, 32, 0.8), 0 0 80px rgba(218, 165, 32, 0.6);
    }
}

.spain-cta-title {
    font-family: 'Libre Baskerville', serif;
    font-size: clamp(2.5rem, 5vw, 4rem);
    color: white;
    margin-bottom: 25px;
    font-weight: 700;
    animation: fadeInUp 1s ease 0.2s both;
    text-shadow: 0 2px 20px rgba(0,0,0,0.5);
}

.spain-cta-subtitle {
    font-size: 1.3rem;
    color: rgba(255,255,255,0.95);
    margin-bottom: 50px;
    max-width: 700px;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.8;
    animation: fadeInUp 1s ease 0.4s both;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
}

.spain-cta-buttons {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
    animation: fadeInUp 1s ease 0.6s both;
}

.spain-cta-button {
    display: inline-block;
    padding: 18px 50px;
    background: #daa520;
    color: white;
    text-decoration: none;
    font-family: 'Libre Baskerville', serif;
    font-size: 1.05rem;
    font-weight: bold;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
    border-radius: 35px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    text-transform: uppercase;
    letter-spacing: 1px;
}

.spain-cta-button::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    background: white;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: width 0.6s, height 0.6s;
    z-index: -1;
}

.spain-cta-button:hover::before {
    width: 300px;
    height: 300px;
}

.spain-cta-button:hover {
    color: #daa520;
    transform: translateY(-5px) scale(1.05);
    box-shadow: 0 20px 50px rgba(218, 165, 32, 0.4);
}

@media (max-width: 768px) {
    .spain-final-cta-section {
        padding: 80px 0;
    }

    .spain-cta-badge {
        padding: 12px 28px;
        font-size: 0.9rem;
        letter-spacing: 2px;
    }

    .spain-cta-title {
        font-size: 2.5rem;
    }

    .spain-cta-subtitle {
        font-size: 1.1rem;
    }

    .spain-cta-buttons {
        flex-direction: column;
        align-items: center;
    }

    .spain-cta-button {
        width: 100%;
        max-width: 300px;
        padding: 16px 40px;
        font-size: 0.95rem;
    }
}

@media (max-width: 480px) {
    .spain-cta-badge {
        padding: 10px 20px;
        font-size: 0.8rem;
    }

    .spain-cta-title {
        font-size: 2rem;
    }

    .spain-cta-button {
        padding: 14px 30px;
        font-size: 0.85rem;
    }
}
</style>

<section class="spain-final-cta-section">
    <div class="spain-cta-background"></div>
    <div class="spain-cta-pattern"></div>
    <div class="spain-cta-content">
        <span class="spain-cta-badge">LIMITED SPACES • APRIL 15-19, 2026</span>

        <h2 class="spain-cta-title">YOUR TRANSFORMATION AWAITS</h2>

        <p class="spain-cta-subtitle">Take the first step toward becoming the man you're meant to be. Join us in Spain for an experience that will reshape your life, your leadership, and your legacy.</p>

        <div class="spain-cta-buttons">
            <a href="https://insight.monumental.global/spainretreat2026" class="spain-cta-button">Apply Here</a>
        </div>
    </div>
</section>

<script>
// Add parallax effect to CTA pattern on scroll
window.addEventListener('scroll', () => {
    const scrolled = window.pageYOffset;
    const pattern = document.querySelector('.spain-cta-pattern');
    if (pattern) {
        pattern.style.transform = `translate(${scrolled * 0.1}px, ${scrolled * 0.1}px)`;
    }
});

// Add ripple effect on button click
document.querySelectorAll('.spain-cta-button, .spain-hero-cta, .spain-video-heading-cta').forEach(button => {
    button.addEventListener('click', function(e) {
        const ripple = document.createElement('span');
        ripple.style.position = 'absolute';
        ripple.style.borderRadius = '50%';
        ripple.style.background = 'rgba(255,255,255,0.5)';
        ripple.style.pointerEvents = 'none';
        this.appendChild(ripple);

        const rect = this.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        const x = e.clientX - rect.left - size / 2;
        const y = e.clientY - rect.top - size / 2;

        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.left = x + 'px';
        ripple.style.top = y + 'px';
        ripple.style.transform = 'scale(0)';
        ripple.style.transition = 'transform 0.6s ease';

        setTimeout(() => {
            ripple.style.transform = 'scale(4)';
            ripple.style.opacity = '0';
        }, 10);

        setTimeout(() => ripple.remove(), 600);
    });
});
</script>
